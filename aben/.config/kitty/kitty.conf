# ~/.config/kitty/kitty.conf
allow_remote_control yes

initial_window_width 900
initial_window_height 600
remember_window_size no

# Set transparency (0.0 is completely transparent, 1.0 is completely opaque)
background_opacity 0.85

# Enable background blur (supported on macOS and some Linux window managers)
background_blur 1

# --- Font Configuration ---
font_family      auto
bold_font        auto
italic_font      auto
bold_italic_font auto

adjust_line_height  115%
adjust_column_width 105%

# --- Color Scheme (The Wired High Contrast) ---
background       #0b0c0d
# CRITICAL: Brightened primary text to a crisp cyber-white/green for readability
foreground       #e5ecee 

# Black
color0           #1c1e20
color8           #52595f   # Made dark text brighter so comments/hidden text stay visible

# Red (Industrial Accent)
color1           #a84545   # Boosted brightness
color9           #d96868

# Green (Eerie CRT Glow)
color2           #608f6f   # Boosted brightness
color10          #89c49c

# Yellow/Amber
color3           #a69268   # Boosted brightness
color11          #dbbf88

# Blue (Subtle Copland OS Tint)
color4           #527494   # Boosted brightness
color12          #7fa5cc

# Magenta
color5           #8c5e8e   # Boosted brightness
color13          #c48ac7

# Cyan
color6           #5b8d94   # Boosted brightness
color14          #82c3cc

# White
color7           #d5e1e3   # Swapped with bright white
color15          #ffffff   # Pure white for high contrast text highlights

# --- Cursor & Selection ---
cursor           #d99938
cursor_text_color #0b0c0d
selection_foreground #ffffff
selection_background #242b30

# --- Window Layout & UI ---
window_padding_width 12
active_border_color #4a5354
inactive_border_color #1c1e20
hide_window_decorations no

# --- Performance & Tweaks ---
repaint_delay    8
input_delay      1
sync_to_monitor  yes
