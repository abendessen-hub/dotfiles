# ~/.config/hypr/hyprtoolkit.conf

# Window backdrop & borders
background = 0xEE0D0E10       # Slightly less harsh dark onyx (0.93 opacity)
base = 0xFF14171A             # Rich charcoal-slate element backgrounds
alternate_base = 0xFF1E2226   # Elevated dark slate for active entry selection

# Typography colors & accents
text = 0xFF657578             # Muted steel gray for standard, unselected entries
bright_text = 0xFFE2EAEB      # Crisp diamond white text for focused elements
accent = 0xFF8EC7D2           # Clean light ice-blue for prompt indicators
accent_secondary = 0xFF3D9BB0 # Deep ice teal for border glow and hover details

# Typography layout
font_size = 11                # Shrunk from 13px to 11px for a cleaner, high-density layout
font_family = LoveLetter Typewriter
font_family_monospace = Courier New

# UI Shaping options
rounding_large = 0            # Enforces blocky terminal aesthetics
rounding_small = 0            # Retains sharp, flat-edge boxes
icon_theme = hicolor          
